name: Package Push NuGet.org
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "要打包推送的版本号（如 1.3.1 或 1.3.1-beta.1，不带 v 前缀）。从分支手动触发时必填——分支名不是合法版本号。"
        required: false
        type: string

jobs:
  package-build:
    name: package build and push
    runs-on: ubuntu-latest
    permissions:
      id-token: write # NuGet OIDC login requires an OIDC token
      contents: read # checkout of the release tag（私有仓库时默认 token 没有这一项会直接 checkout 失败）

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET (pinned by global.json)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      # Tag convention: bare semver (e.g. 1.3.1). Tolerate an accidental "v" prefix.
      # workflow_dispatch 可显式传 version 输入（从分支手动触发时 GITHUB_REF_NAME 是分支名，不是版本号）。
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Packs all 6 packages (nupkg + snupkg) into ./artifacts; push happens below via OIDC login.
      - name: Pack
        run: bash ./build/pack.sh "${{ steps.version.outputs.version }}"

      # Temporary API key via NuGet OIDC — no stored NUGET_API_KEY secret needed.
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages (nupkg + snupkg)
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          -k ${{ steps.login.outputs.NUGET_API_KEY }}
          -s https://api.nuget.org/v3/index.json
          --skip-duplicate
