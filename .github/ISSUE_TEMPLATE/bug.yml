name: Bug report
description: Report a problem with MASA.Lingua (server, SDKs, or CLI)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below.
        For usage questions, consider [Discussions](https://github.com/masastack/MASA.Lingua/discussions) first.

        Security vulnerabilities must **not** be reported here — see [SECURITY.md](../../SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps — a small code snippet or curl commands against the API are ideal.
      placeholder: |
        1. Start the server with ...
        2. POST /api/v1/projects/...
        3. See error
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Server (admin UI / distribution endpoints)
        - MASA.Lingua.SDK.AspNetCore
        - MASA.Lingua.SDK.MasaI18n
        - MASA.Lingua.SDK.MasaBlazor
        - MASA.Lingua.SDK.Maui
        - MASA.Lingua.Core
        - Storage (EF Core / migrations)
        - AI translation
        - @lingua/vue / lingua-sync CLI
        - Docs
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Package or server version (and target framework if relevant).
      placeholder: e.g. 1.3.0, net10.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
